[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htr-bench"
version = "0.1.0"
description = "Local benchmark for handwritten document transcription with open-weights VLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "jiwer>=3.0",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10.0",
  "openai>=1.40",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
serve = ["vllm>=0.6.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
