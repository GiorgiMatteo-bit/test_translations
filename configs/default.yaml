# Default benchmark run config. Used as documentation today; scripts/evaluate.py
# currently takes CLI flags. Promote to a real config loader once we have more
# than one experiment matrix to manage.

dataset:
  iam_root: /data/iam
  split: test
  limit: null

inference:
  endpoint: http://localhost:8000/v1
  model: Qwen/Qwen2.5-VL-7B-Instruct
  temperature: 0.0
  max_tokens: 2048
  concurrency: 4
  prompt: default

eval:
  normalize: true

output:
  results_dir: results
